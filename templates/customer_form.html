{% extends 'base.html' %} {% block title %}{{ 'Edit' if customer else 'New' }}
Customer — OrderBase{% endblock %} {% block page_title %}{{ 'Edit Customer' if
customer else 'New Customer' }}{% endblock %} {% block content %}
<div class="form-card">
  <form method="POST">
    <div class="form-group">
      <label>Full Name</label>
      <input
        type="text"
        name="name"
        value="{{ customer.name if customer else '' }}"
        placeholder="e.g. Jane Smith"
        required />
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input
        type="email"
        name="email"
        value="{{ customer.email if customer else '' }}"
        placeholder="jane@example.com"
        required />
    </div>
    <div class="form-group">
      <label>Phone (optional)</label>
      <input
        type="text"
        name="phone"
        value="{{ customer.phone if customer else '' }}"
        placeholder="+1 555 0100" />
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {{ 'Save Changes' if customer else 'Add Customer' }}
      </button>
      <a href="{{ url_for('customers') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
