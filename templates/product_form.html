{% extends 'base.html' %} {% block title %}{{ 'Edit' if product else 'New' }}
Product — OrderBase{% endblock %} {% block page_title %}{{ 'Edit Product' if
product else 'New Product' }}{% endblock %} {% block content %}
<div class="form-card">
  <form method="POST">
    <div class="form-group">
      <label>Product Name</label>
      <input
        type="text"
        name="name"
        value="{{ product.name if product else '' }}"
        placeholder="e.g. Laptop, Wireless Mouse"
        required />
    </div>

    <div class="form-group">
      <label>Category</label>
      <input
        type="text"
        name="category"
        value="{{ product.category if product else '' }}"
        placeholder="e.g. Electronics, Furniture" />
    </div>

    <div class="form-group">
      <label>Price ($)</label>
      <input
        type="number"
        name="price"
        step="0.01"
        min="0"
        value="{{ product.price if product else '' }}"
        placeholder="0.00"
        required />
    </div>

    <div class="form-group">
      <label>Stock (units)</label>
      <input
        type="number"
        name="stock"
        min="0"
        value="{{ product.stock if product else '0' }}"
        placeholder="0" />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {{ 'Save Changes' if product else 'Add Product' }}
      </button>
      <a href="{{ url_for('products') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
